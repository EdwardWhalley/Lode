# The database servers the integration tests run against, started by scripts/test-all.*.
name: lode-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lode-test
    ports:
      - "127.0.0.1:53306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -plode-test --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: lode-test
    ports:
      - "127.0.0.1:53307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
